[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railroad-maintenance-simulator"
version = "0.5.0"
description = "Simulation toolkit for planning MTBT grinding maintenance across a corridor with spurs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Rumo Grinding Engineering"}
]
keywords = [
  "railroad",
  "maintenance",
  "simulation",
  "mtbt",
  "operations-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Topic :: Scientific/Engineering :: Simulation",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pandas>=2.1",
  "matplotlib>=3.8",
  "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5.5",
  "mypy>=1.11",
  "nox>=2024.4.15",
  "pandas-stubs>=2.1.4.240514",
  "types-networkx>=3.2.0.20240405",
]
ui = [
  "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  ".",
]
testpaths = ["tests"]

